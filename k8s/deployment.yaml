apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-monitoramento
spec:
  replicas: 2

  selector:
    matchLabels:
      app: app-monitoramento

  template:
    metadata:
      labels:
        app: app-monitoramento

    spec:
      containers:
        - name: app-monitoramento
          image: app-fask-monitoramento:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000

          resources:
            requests:
              cpu: "100m"
            limits:
              cpu: "500m"

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3